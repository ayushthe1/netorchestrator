server:
  port: "8080"
  host: "0.0.0.0"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: "localhost"
  port: 5432
  user: "netorchestrator"
  password: "password"
  dbname: "netorchestrator"
  sslmode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

influxdb:
  url: "http://localhost:8086"
  token: ""
  org: "netorchestrator"
  bucket: "network_metrics"

kafka:
  brokers: ["localhost:9092"]
  group_id: "netorchestrator"

nats:
  url: "nats://localhost:4222"

jwt:
  secret: "your-secret-key-change-this-in-production"
  expiration: 3600

logging:
  level: "info"
  format: "json"

services:
  network_service:
    host: "localhost"
    port: 8081
  monitoring_service:
    host: "localhost"
    port: 8082
  orchestration_service:
    host: "localhost"
    port: 8083
  validation_service:
    host: "localhost"
    port: 8084
