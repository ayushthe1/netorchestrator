server:
  port: 8080
  mode: release

database:
  host: localhost
  port: 5432
  dbname: netorchestrator
  user: netorchestrator
  password: "password"
  sslmode: disable
  max_connections: 25
  max_idle_connections: 5

redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

security:
  jwt_secret: ""
  api_rate_limit: 100
  enable_cors: true

# OpenAI Configuration for AI-powered features
openai:
  api_key: ""  # Will be loaded from OPENAI_API_KEY environment variable or .env file
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 2000
  enabled: false  # Set to true when API key is provided