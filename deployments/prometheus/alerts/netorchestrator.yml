groups:
  - name: netorchestrator.rules
    rules:
      # System Health Alerts
      - alert: NetOrchestratorDown
        expr: up{job="netorchestrator"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "NetOrchestrator service is down"
          description: "NetOrchestrator service has been down for more than 1 minute."
          runbook_url: "https://docs.netorchestrator.io/runbooks/service-down"

      - alert: HighErrorRate
        expr: rate(netorchestrator_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for more than 5 minutes."

      # Performance Alerts  
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(netorchestrator_http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s for more than 10 minutes."

      - alert: HighCPUUsage
        expr: netorchestrator_node_cpu_usage_percent > 85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on node {{ $labels.node_id }}"
          description: "Node {{ $labels.node_id }} CPU usage is {{ $value }}% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: netorchestrator_node_memory_usage_percent > 90
        for: 3m
        labels:
          severity: error
          category: performance
        annotations:
          summary: "High memory usage on node {{ $labels.node_id }}"
          description: "Node {{ $labels.node_id }} memory usage is {{ $value }}% for more than 3 minutes."

      - alert: DiskSpaceLow
        expr: netorchestrator_node_disk_usage_percent > 85
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Low disk space on node {{ $labels.node_id }}"
          description: "Node {{ $labels.node_id }} disk usage is {{ $value }}% for more than 10 minutes."

      # Network Alerts
      - alert: NetworkDown
        expr: netorchestrator_networks_active == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "No active networks detected"
          description: "All networks are down or inactive for more than 1 minute."

      - alert: HighNetworkLatency
        expr: netorchestrator_network_latency_seconds > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High network latency detected"
          description: "Network {{ $labels.network_id }} latency is {{ $value }}s for more than 5 minutes."

      - alert: LowNetworkThroughput
        expr: rate(netorchestrator_network_throughput_bytes_total[5m]) < 1000000
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Low network throughput"
          description: "Network {{ $labels.network_id }} throughput is {{ $value | humanize1024 }}B/s for more than 10 minutes."

      # Database Alerts
      - alert: DatabaseConnectionsHigh
        expr: netorchestrator_database_connections_active > 80
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High database connection count"
          description: "Active database connections: {{ $value }}"

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(netorchestrator_database_query_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile query time is {{ $value }}s for more than 10 minutes."

      # WebSocket Alerts
      - alert: WebSocketConnectionsHigh
        expr: netorchestrator_websocket_connections > 1000
        for: 2m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High WebSocket connection count"
          description: "WebSocket connections: {{ $value }}"

      - alert: WebSocketMessageBacklog
        expr: netorchestrator_websocket_message_queue_size > 1000
        for: 5m
        labels:
          severity: error
          category: performance
        annotations:
          summary: "WebSocket message backlog detected"
          description: "WebSocket message queue size: {{ $value }}"

      # Business Logic Alerts
      - alert: PolicyViolationSpike
        expr: increase(netorchestrator_policy_violations_total[1h]) > 10
        for: 0m
        labels:
          severity: error
          category: business
        annotations:
          summary: "Policy violation spike detected"
          description: "{{ $value }} policy violations in the last hour."

      - alert: SLABreach
        expr: netorchestrator_sla_compliance_percent < 95
        for: 5m
        labels:
          severity: error
          category: business
        annotations:
          summary: "SLA compliance breach"
          description: "SLA compliance is {{ $value }}% for more than 5 minutes."

      - alert: LowCustomerSatisfaction
        expr: netorchestrator_customer_satisfaction_score < 6
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low customer satisfaction detected"
          description: "Customer satisfaction score is {{ $value }} for more than 30 minutes."

      # Capacity Planning Alerts
      - alert: HighResourceUtilization
        expr: netorchestrator_resource_utilization_percent > 80
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High resource utilization"
          description: "{{ $labels.resource_type }} utilization is {{ $value }}% for more than 15 minutes."

      - alert: NetworkProvisioningDelay
        expr: histogram_quantile(0.95, rate(netorchestrator_network_provisioning_duration_seconds_bucket[10m])) > 300
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Network provisioning delays detected"
          description: "95th percentile provisioning time is {{ $value }}s for more than 10 minutes."

      # Cache Performance Alerts
      - alert: LowCacheHitRate
        expr: netorchestrator_cache_hit_rate < 0.8
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for more than 10 minutes."

      # Security Alerts
      - alert: UnauthorizedAccessAttempts
        expr: increase(netorchestrator_unauthorized_access_attempts_total[10m]) > 5
        for: 0m
        labels:
          severity: error
          category: security
        annotations:
          summary: "Multiple unauthorized access attempts"
          description: "{{ $value }} unauthorized access attempts in the last 10 minutes."

      # Automation Alerts
      - alert: AutomationTaskFailures
        expr: increase(netorchestrator_automation_task_failures_total[1h]) > 3
        for: 0m
        labels:
          severity: warning
          category: automation
        annotations:
          summary: "Automation task failures detected"
          description: "{{ $value }} automation tasks failed in the last hour."

  - name: netorchestrator.aggregation
    rules:
      # Aggregation rules for better query performance
      - record: netorchestrator:http_request_rate
        expr: rate(netorchestrator_http_requests_total[5m])

      - record: netorchestrator:http_error_rate
        expr: rate(netorchestrator_http_requests_total{status=~"5.."}[5m]) / rate(netorchestrator_http_requests_total[5m])

      - record: netorchestrator:http_response_time_95th
        expr: histogram_quantile(0.95, rate(netorchestrator_http_request_duration_seconds_bucket[5m]))

      - record: netorchestrator:network_health_score
        expr: (
          (netorchestrator_networks_active / netorchestrator_networks_total) * 0.4 +
          (1 - netorchestrator_network_latency_seconds / 2) * 0.3 +
          (netorchestrator_sla_compliance_percent / 100) * 0.3
        )

      - record: netorchestrator:system_health_score
        expr: (
          up{job="netorchestrator"} * 0.3 +
          (1 - netorchestrator:http_error_rate) * 0.3 +
          (netorchestrator_database_connections_active / 100) * 0.2 +
          (netorchestrator_cache_hit_rate) * 0.2
        )