apiVersion: v2
name: netorchestrator
description: Enterprise Network-as-a-Service (NaaS) automation platform with comprehensive monitoring and real-time capabilities
type: application
version: 2.0.0
appVersion: "v2.0"
home: https://netorchestrator.io
sources:
  - https://github.com/company/netorchestrator
maintainers:
  - name: NetOrchestrator Platform Team
    email: platform-team@company.com
    url: https://netorchestrator.io/team
keywords:
  - networking
  - automation
  - kubernetes
  - monitoring
  - naas
  - prometheus
  - grafana
  - microservices
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: "22.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
annotations:
  category: Infrastructure
  licenses: Apache-2.0
  artifacthub.io/changes: |
    - Added comprehensive Kubernetes deployment
    - Implemented enterprise monitoring stack
    - Added WebSocket real-time capabilities
    - Enhanced security with RBAC and NetworkPolicies
    - Added horizontal pod autoscaling
    - Implemented ingress with TLS termination
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/company/netorchestrator/tree/main/helm
    - name: Documentation
      url: https://docs.netorchestrator.io
    - name: Support
      url: https://netorchestrator.io/support