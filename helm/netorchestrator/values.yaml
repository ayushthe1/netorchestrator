# NetOrchestrator Helm Chart Values
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "standard"

# Application configuration
app:
  name: netorchestrator
  version: "v2.0"
  
image:
  registry: docker.io
  repository: netorchestrator/api-gateway
  tag: "v2.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment configuration
deployment:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  
  # Pod annotations
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  
  # Node selector and tolerations
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "netorchestrator-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.netorchestrator.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: netorchestrator-tls
      hosts:
        - api.netorchestrator.local

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Configuration
config:
  server:
    host: "0.0.0.0"
    port: "8080"
    readTimeout: 30
    writeTimeout: 30
    idleTimeout: 60
  
  logging:
    level: "info"
    format: "json"
  
  auth:
    jwtSecret: "your-super-secret-jwt-key-change-in-production"
    jwtExpiry: 3600
    refreshExpiry: 86400

# Database configuration (PostgreSQL)
postgresql:
  enabled: true
  auth:
    username: netorchestrator
    password: netorchestrator123
    database: netorchestrator
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

# Cache configuration (Redis)
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Time-series database configuration (InfluxDB)
influxdb:
  enabled: true
  image:
    tag: "2.7-alpine"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  config:
    setup:
      username: admin
      password: netorchestrator123
      org: netorchestrator
      bucket: metrics
      token: netorchestrator-super-secret-token
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Monitoring configuration (Prometheus)
prometheus:
  enabled: true
  server:
    retention: "30d"
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    
    # Prometheus configuration
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'netorchestrator-k8s'
        environment: 'production'
    
    # Alert rules
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: netorchestrator.rules
            rules:
              - alert: NetOrchestratorDown
                expr: up{job="netorchestrator"} == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "NetOrchestrator service is down"
                  description: "NetOrchestrator service has been down for more than 1 minute."

# Visualization configuration (Grafana)
grafana:
  enabled: true
  adminPassword: netorchestrator123
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  # Grafana configuration
  grafana.ini:
    security:
      admin_user: admin
      admin_password: netorchestrator123
    users:
      allow_sign_up: false
    server:
      root_url: "https://grafana.netorchestrator.local"
  
  # Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://{{ include "netorchestrator.fullname" . }}-prometheus-server
          access: proxy
          isDefault: true
        - name: InfluxDB
          type: influxdb
          url: http://{{ include "netorchestrator.fullname" . }}-influxdb:8086
          access: proxy
          database: metrics
          user: admin
          password: netorchestrator123

# Alerting configuration (Alertmanager)
alertmanager:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Alertmanager configuration
  config:
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'netorchestrator-alerts@company.com'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 30m
    
    receivers:
      - name: 'web.hook'
        webhook_configs:
          - url: 'http://{{ include "netorchestrator.fullname" . }}-service:8080/api/v1/alerts/webhook'
            send_resolved: true
      
      - name: 'critical-alerts'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            channel: '#critical-alerts'
            username: 'NetOrchestrator-K8s-Critical'
            color: 'danger'
            title: '🚨 K8s Critical Alert: {{ .GroupLabels.alertname }}'

# Network Policies
networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Pod Security Policy
podSecurityPolicy:
  enabled: false

# Secrets
secrets:
  postgres:
    password: "netorchestrator123"
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production"
  influxdb:
    token: "netorchestrator-super-secret-token"

# Additional volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Additional environment variables
extraEnvVars: []

# Additional init containers
initContainers: []

# Additional sidecar containers
sidecars: []

# Lifecycle hooks
lifecycle: {}

# Custom startup, liveness and readiness probes
customStartupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

# Pod Security Context
podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s