apiVersion: v1
kind: Namespace
metadata:
  name: netorchestrator
  labels:
    name: netorchestrator
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/version: "v2.0"
    app.kubernetes.io/component: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netorchestrator-config
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: config
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: "8080"
      read_timeout: 30
      write_timeout: 30
      idle_timeout: 60
    database:
      host: "postgres-service"
      port: 5432
      user: "netorchestrator"
      password: "netorchestrator123"
      name: "netorchestrator"
      ssl_mode: "disable"
      max_open_conns: 25
      max_idle_conns: 25
      conn_max_lifetime: 300
    redis:
      host: "redis-service"
      port: 6379
      database: 0
      password: ""
      pool_size: 10
    influxdb:
      host: "influxdb-service"
      port: 8086
      database: "netorchestrator"
      username: "admin"
      password: "netorchestrator123"
      token: "netorchestrator-super-secret-token"
      org: "netorchestrator"
      bucket: "metrics"
    logging:
      level: "info"
      format: "json"
    auth:
      jwt_secret: "your-super-secret-jwt-key-change-in-production"
      jwt_expiry: 3600
      refresh_expiry: 86400
---
apiVersion: v1
kind: Secret
metadata:
  name: netorchestrator-secrets
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: secret
type: Opaque
data:
  # Base64 encoded values
  postgres-password: bmV0b3JjaGVzdHJhdG9yMTIz  # netorchestrator123
  jwt-secret: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==  # your-super-secret-jwt-key-change-in-production
  influxdb-token: bmV0b3JjaGVzdHJhdG9yLXN1cGVyLXNlY3JldC10b2tlbg==  # netorchestrator-super-secret-token
---
apiVersion: v1
kind: Service
metadata:
  name: netorchestrator-service
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: api-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: websocket
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netorchestrator-api
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: "v2.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: netorchestrator
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netorchestrator
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/version: "v2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: netorchestrator-service-account
      containers:
        - name: api-gateway
          image: netorchestrator:v2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/app/config/config.yaml"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netorchestrator-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netorchestrator-secrets
                  key: jwt-secret
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netorchestrator-secrets
                  key: influxdb-token
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-volume
          configMap:
            name: netorchestrator-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netorchestrator-service-account
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netorchestrator-role
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netorchestrator-role-binding
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: netorchestrator-service-account
    namespace: netorchestrator
roleRef:
  kind: Role
  name: netorchestrator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netorchestrator-hpa
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netorchestrator-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netorchestrator-pdb
  namespace: netorchestrator
  labels:
    app.kubernetes.io/name: netorchestrator
    app.kubernetes.io/component: pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netorchestrator
      app.kubernetes.io/component: api-gateway