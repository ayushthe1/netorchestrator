! FRRouting configuration for NetOrchestrator Demo
!
frr version 8.0
frr defaults traditional
!
hostname frr-router
password netorchestrator
enable password netorchestrator
!
interface lo
 ip address 10.0.0.1/32
!
interface eth0
 ip address 192.168.1.1/24
!
router ospf
 ospf router-id 10.0.0.1
 network 10.0.0.0/32 area 0
 network 192.168.1.0/24 area 0
!
line vty
 password netorchestrator
!
