# Podman-compatible compose file
# Use with: podman-compose up -d
version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: netorchestrator
      POSTGRES_USER: netorchestrator
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netorchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Podman-specific: ensure rootless compatibility
    security_opt:
      - label:disable

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - label:disable

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: netorchestrator
      DOCKER_INFLUXDB_INIT_BUCKET: network_metrics
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - label:disable

volumes:
  postgres_data:
  redis_data:
  influxdb_data: