<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOrchestrator WebSocket Event Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #27ae60;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            margin-left: auto;
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #6c757d;
        }

        .stats span {
            font-weight: 600;
            color: #333;
        }

        .event-log {
            height: calc(100vh - 250px);
            overflow-y: auto;
            padding: 20px 30px;
            background: #1e1e1e;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .event-item {
            margin-bottom: 15px;
            padding: 12px;
            background: #2d2d2d;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-item.error {
            border-left-color: #e74c3c;
            background: #3d2d2d;
        }

        .event-item.info {
            border-left-color: #3498db;
        }

        .event-item.success {
            border-left-color: #27ae60;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #b4b4b4;
            font-size: 12px;
        }

        .event-type {
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .event-timestamp {
            color: #6c757d;
            font-size: 11px;
        }

        .event-data {
            color: #d4d4d4;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .json-key {
            color: #79c0ff;
        }

        .json-string {
            color: #a5d6a7;
        }

        .json-number {
            color: #ffab70;
        }

        .json-boolean {
            color: #f78c6c;
        }

        .json-null {
            color: #ae81ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #adb5bd;
        }

        .empty-state p {
            font-size: 14px;
            color: #6c757d;
        }

        /* Scrollbar styling */
        .event-log::-webkit-scrollbar {
            width: 8px;
        }

        .event-log::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .event-log::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .event-log::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 NetOrchestrator WebSocket Event Viewer</h1>
            <div class="status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="connectBtn" onclick="connect()">Connect</button>
            <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
            <button class="btn btn-secondary" onclick="clearLog()">Clear Log</button>
            
            <div class="stats">
                <div>Events: <span id="eventCount">0</span></div>
                <div>Errors: <span id="errorCount">0</span></div>
            </div>
        </div>

        <div class="event-log" id="eventLog">
            <div class="empty-state">
                <h3>WebSocket Event Viewer</h3>
                <p>Click "Connect" to start receiving real-time events from NetOrchestrator</p>
                <p style="margin-top: 10px; font-size: 12px;">Endpoint: ws://localhost:8080/ws</p>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let eventCount = 0;
        let errorCount = 0;
        let isConnected = false;

        const WS_URL = 'ws://localhost:8080/ws';

        function updateStatus(connected) {
            isConnected = connected;
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (connected) {
                indicator.classList.add('connected');
                statusText.textContent = 'Connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                indicator.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function updateStats() {
            document.getElementById('eventCount').textContent = eventCount;
            document.getElementById('errorCount').textContent = errorCount;
        }

        function formatJSON(obj) {
            if (typeof obj === 'string') {
                try {
                    obj = JSON.parse(obj);
                } catch (e) {
                    return escapeHtml(obj);
                }
            }

            return JSON.stringify(obj, null, 2)
                .replace(/("[\w]+"):/g, '<span class="json-key">$1</span>:')
                .replace(/: ("[^"]*")/g, ': <span class="json-string">$1</span>')
                .replace(/: (-?\d+\.?\d*)/g, ': <span class="json-number">$1</span>')
                .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
                .replace(/: null/g, ': <span class="json-null">null</span>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addEvent(type, data, isError = false, isInfo = false, isSuccess = false) {
            const eventLog = document.getElementById('eventLog');
            
            // Remove empty state if present
            const emptyState = eventLog.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            
            if (isError) {
                eventItem.classList.add('error');
            } else if (isInfo) {
                eventItem.classList.add('info');
            } else if (isSuccess) {
                eventItem.classList.add('success');
            }

            const timestamp = new Date().toLocaleTimeString('en-US', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                fractionalSecondDigits: 3
            });

            let formattedData = '';
            if (typeof data === 'object') {
                formattedData = formatJSON(data);
            } else if (typeof data === 'string') {
                try {
                    const parsed = JSON.parse(data);
                    formattedData = formatJSON(parsed);
                } catch (e) {
                    formattedData = escapeHtml(data);
                }
            } else {
                formattedData = escapeHtml(String(data));
            }

            eventItem.innerHTML = `
                <div class="event-header">
                    <span class="event-type">${escapeHtml(type)}</span>
                    <span class="event-timestamp">${timestamp}</span>
                </div>
                <div class="event-data">${formattedData}</div>
            `;

            eventLog.insertBefore(eventItem, eventLog.firstChild);

            // Update stats
            if (isError) {
                errorCount++;
            } else {
                eventCount++;
            }
            updateStats();

            // Auto-scroll to top (newest events)
            eventLog.scrollTop = 0;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addEvent('INFO', 'Already connected', false, true);
                return;
            }

            addEvent('CONNECTION', 'Connecting to ' + WS_URL + '...', false, true);

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = function(event) {
                    updateStatus(true);
                    addEvent('CONNECTION', {
                        status: 'connected',
                        url: WS_URL,
                        timestamp: new Date().toISOString()
                    }, false, false, true);
                };

                ws.onmessage = function(event) {
                    let data;
                    try {
                        data = JSON.parse(event.data);
                    } catch (e) {
                        data = event.data;
                    }

                    addEvent('EVENT', {
                        type: data.type || 'unknown',
                        data: data.data || data,
                        timestamp: data.timestamp || new Date().toISOString()
                    });
                };

                ws.onerror = function(error) {
                    addEvent('ERROR', {
                        message: 'WebSocket error occurred',
                        error: error.message || 'Unknown error',
                        timestamp: new Date().toISOString()
                    }, true);
                };

                ws.onclose = function(event) {
                    updateStatus(false);
                    addEvent('CONNECTION', {
                        status: 'disconnected',
                        code: event.code,
                        reason: event.reason || 'Connection closed',
                        wasClean: event.wasClean,
                        timestamp: new Date().toISOString()
                    }, false, true);

                    // Auto-reconnect after 3 seconds if connection was unexpected
                    if (!event.wasClean && !document.getElementById('disconnectBtn').disabled) {
                        addEvent('INFO', 'Attempting to reconnect in 3 seconds...', false, true);
                        setTimeout(() => {
                            if (!isConnected) {
                                connect();
                            }
                        }, 3000);
                    }
                };

            } catch (error) {
                updateStatus(false);
                addEvent('ERROR', {
                    message: 'Failed to create WebSocket connection',
                    error: error.message,
                    timestamp: new Date().toISOString()
                }, true);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close(1000, 'User requested disconnect');
                ws = null;
            }
            updateStatus(false);
        }

        function clearLog() {
            const eventLog = document.getElementById('eventLog');
            eventLog.innerHTML = `
                <div class="empty-state">
                    <h3>WebSocket Event Viewer</h3>
                    <p>Log cleared. Click "Connect" to start receiving events</p>
                </div>
            `;
            eventCount = 0;
            errorCount = 0;
            updateStats();
        }

        // Handle page unload
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });

        // Initialize
        updateStats();
    </script>
</body>
</html>
